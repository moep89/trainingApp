<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trainingsplan</title>
<style>
:root{--bg:#111418;--card:#1c2128;--fg:#eef1f4;--mut:#9aa5b1;--acc:#ff9f1c;--ok:#2ecc71;--line:#2d343d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 system-ui,sans-serif;padding:0 12px calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top);background:var(--bg);padding-bottom:10px;z-index:5}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:14px 6px;font-size:16px;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
h2{font-size:15px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
.ex{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.ex.done{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700}.vol{color:var(--acc);font-size:14px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.set{width:54px;height:54px;border-radius:50%;border:2px solid var(--mut);background:none;color:var(--fg);font-size:18px;font-weight:700}
.set.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.w{width:86px;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-size:17px;text-align:center;margin-left:auto}
.info{background:none;border:0;color:var(--mut);font-size:14px;padding:6px 0 0;text-decoration:underline}
.fig{display:flex;gap:6px;margin-bottom:8px}
.fig figure{flex:1;margin:0;text-align:center}
.fig svg{width:100%;max-height:130px;background:var(--bg);border-radius:10px}
.fig figcaption{font-size:12px;color:var(--mut)}
.fig .b{stroke:#6aa9ff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fig .h{stroke:#6aa9ff;fill:var(--bg);stroke-width:2.5}
.fig .a{stroke:var(--acc);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fig .g{stroke:var(--mut);fill:none;stroke-width:1.5}
.fig .q{stroke:var(--mut);fill:#2d343d;stroke-width:1}
.fig .e{stroke:var(--mut);fill:none;stroke-width:2.5;stroke-linecap:round}
.fig .w{fill:#ddd;stroke:#000}
.fig .d{stroke:var(--acc);stroke-width:1;stroke-dasharray:2 2}
.tip{display:none;color:var(--mut);font-size:15px;margin-top:6px}
.tip.show{display:block}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;min-height:60px;width:100%;border:0;color:var(--fg);font-size:17px;text-align:left}
.row .box{flex:none;width:30px;height:30px;border:2px solid var(--mut);border-radius:8px;display:flex;align-items:center;justify-content:center}
.row.on .box{background:var(--ok);border-color:var(--ok)}
.row.on .box:after{content:"✓";color:#06210f;font-weight:900}
.row.on .t{text-decoration:line-through;color:var(--mut)}
.row small{display:block;color:var(--mut)}
.note{color:var(--mut);font-size:14px}
.reset{width:100%;margin-top:24px;padding:16px;border-radius:12px;border:2px solid #e74c3c;background:none;color:#e74c3c;font-size:17px;font-weight:700}
</style>
</head>

function figSvg(p) {
  const N = "http://www.w3.org/2000/svg", y = v => 100 - v;
  const svg = document.createElementNS(N, "svg");
  svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("aria-hidden", "true");
  const add = (tag, attrs) => { const e = document.createElementNS(N, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); };
  add("line", {x1: 2, y1: y(10), x2: 98, y2: y(10), class: "g"});
  (p.e || []).forEach(q => {
    if (q[0] === "R") add("rect", {x: q[1], y: y(q[2] + q[4]), width: q[3], height: q[4], rx: 2, class: "q"});
    else if (q[0] === "L") add("line", {x1: q[1], y1: y(q[2]), x2: q[3], y2: y(q[4]), class: "e"});
    else if (q[0] === "D") add("line", {x1: q[1], y1: y(q[2]), x2: q[3], y2: y(q[4]), class: "d"});
    else if (q[0] === "W") add("circle", {cx: q[1], cy: y(q[2]), r: 4.5, class: "w"});
  });
  const poly = (pts, cls) => add("polyline", {points: pts.map(q => q[0] + "," + y(q[1])).join(" "), class: cls});
  p.l.forEach(pts => poly(pts, "b"));
  (p.a || []).forEach(pts => poly(pts, "a"));
  add("circle", {cx: p.h[0], cy: y(p.h[1]), r: 6, class: "h"});
  return svg;
}
function figure(key) {
  const poses = FIG[key]; if (!poses) return null;
  const box = document.createElement("div"); box.className = "fig";
  poses.forEach((p, i) => {
    const f = document.createElement("figure"); f.appendChild(figSvg(p));
    if (poses.length > 1) { const c = document.createElement("figcaption"); c.textContent = key === "plank" ? ["Plank", "Side Plank"][i] : ["Start", "Ende"][i]; f.appendChild(c); }
    box.appendChild(f);
  });
  return box;
}
const KEY = "trainingsplan.v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
state.checks = state.checks || {};
state.weights = state.weights || {};
state.tab = PLAN[state.tab] ? state.tab : "A";
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const $ = id => document.getElementById(id);
const id = (u, si, ii) => u + "-" + si + "-" + ii;

function progress() {
  let total = 0, done = 0;
  PLAN[state.tab].sections.forEach((sec, si) => sec.items.forEach((it, ii) => {
    const n = it.s || 1;
    total += n;
    for (let k = 0; k < n; k++) if (state.checks[id(state.tab, si, ii) + "-" + k]) done++;
  }));
  $("prog").style.width = (total ? done / total * 100 : 0) + "%";
}

function render() {
  const tabs = $("tabs"); tabs.innerHTML = "";
  Object.keys(PLAN).forEach(k => {
    const b = document.createElement("button");
    b.textContent = PLAN[k].title; b.className = k === state.tab ? "on" : "";
    b.onclick = () => { state.tab = k; save(); render(); window.scrollTo(0, 0); };
    tabs.appendChild(b);
  });
  const main = $("main"); main.innerHTML = "";
  PLAN[state.tab].sections.forEach((sec, si) => {
    const h = document.createElement("h2"); h.textContent = sec.h; main.appendChild(h);
    sec.items.forEach((it, ii) => {
      const base = id(state.tab, si, ii);
      const tip = document.createElement("div"); tip.className = "tip";
      const fg = it.g && figure(it.g); if (fg) tip.appendChild(fg);
      if (it.t) tip.appendChild(document.createTextNode(it.t));
      const infoBtn = () => {
        if (!it.t && !fg) return null;
        const i = document.createElement("button"); i.className = "info"; i.textContent = "Ausführung";
        i.onclick = () => tip.classList.toggle("show"); return i;
      };
      if (!it.s) {
        const r = document.createElement("button");
        r.className = "row" + (state.checks[base + "-0"] ? " on" : "");
        r.innerHTML = '<span class="box"></span><span class="t"></span>';
        const t = r.querySelector(".t");
        t.textContent = it.n;
        if (it.v) { const s = document.createElement("small"); s.textContent = it.v; t.appendChild(s); }
        r.onclick = () => { state.checks[base + "-0"] = !state.checks[base + "-0"]; save(); r.classList.toggle("on"); progress(); };
        main.appendChild(r);
        if (tip.firstChild) { const i = infoBtn(); i.style.marginBottom = "8px"; main.appendChild(i); main.appendChild(tip); }
        return;
      }
      const card = document.createElement("div"); card.className = "ex";
      const top = document.createElement("div"); top.className = "top";
      top.innerHTML = '<div><div class="name"></div><div class="vol"></div></div>';
      top.querySelector(".name").textContent = it.n; top.querySelector(".vol").textContent = it.v;
      card.appendChild(top);
      const sets = document.createElement("div"); sets.className = "sets";
      const upd = () => {
        let all = true;
        for (let k = 0; k < it.s; k++) if (!state.checks[base + "-" + k]) all = false;
        card.classList.toggle("done", all);
      };
      for (let k = 0; k < it.s; k++) {
        const b = document.createElement("button");
        b.className = "set" + (state.checks[base + "-" + k] ? " on" : ""); b.textContent = k + 1;
        b.setAttribute("aria-label", it.n + " Satz " + (k + 1));
        b.onclick = () => {
          const on = !state.checks[base + "-" + k]; state.checks[base + "-" + k] = on;
          save(); b.classList.toggle("on", on); upd(); progress();
        };
        sets.appendChild(b);
      }
      if (it.w) {
        const w = document.createElement("input"); w.className = "w"; w.type = "text"; w.inputMode = "decimal";
        w.placeholder = "kg"; w.value = state.weights[base] || ""; w.setAttribute("aria-label", "Gewicht " + it.n);
        w.oninput = () => { state.weights[base] = w.value; save(); };
        sets.appendChild(w);
      }
      card.appendChild(sets);
      if (tip.firstChild) { const i = infoBtn(); card.appendChild(i); card.appendChild(tip); }
      main.appendChild(card); upd();
    });
  });
  const n = document.createElement("p"); n.className = "note";
  n.textContent = "Gewichte bleiben beim Zurücksetzen erhalten, damit du die Progression siehst.";
  main.appendChild(n);
  const r = document.createElement("button"); r.className = "reset"; r.textContent = "Einheit zurücksetzen";
  r.onclick = () => {
    if (!confirm("Alle Häkchen von " + PLAN[state.tab].title + " zurücksetzen?")) return;
    Object.keys(state.checks).forEach(k => { if (k.startsWith(state.tab + "-")) delete state.checks[k]; });
    save(); render(); window.scrollTo(0, 0);
  };
  main.appendChild(r);
  progress();
}

render();
</script>
</body>
</html>
